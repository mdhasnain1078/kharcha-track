name: finance_tracker
description: "A personal finance companion app for tracking transactions, goals, and spending insights."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.2

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Charts
  fl_chart: ^0.70.2

  # UI Enhancements
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  gap: ^3.0.1

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.5.2

  # Data Export
  csv: ^6.0.0
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  local_auth: ^3.0.1
  sticky_headers: ^0.3.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
